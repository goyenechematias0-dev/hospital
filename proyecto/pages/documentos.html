<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Documentos - MBM Médica</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <header>
    <h1>Gestión Documental</h1>
    <nav>
      <a href="index.html">Inicio</a> |
      <a href="traslados.html">Traslados</a> |
      <a href="documentos.html">Documentos</a> |
      <a href="login.html">Cerrar Sesión</a>
    </nav>
  </header>

  <main>
    <h2>Subir Nuevo Documento Hospitalario</h2>
    <form id="form-documentos">
      <label for="titulo">Título del Documento:</label><br>
      <input type="text" id="titulo" name="titulo" required><br><br>

      <label for="categoria">Categoría:</label><br>
      <select id="categoria" name="categoria">
        <option value="historia_clinica">Historia Clínica</option>
        <option value="informe_medico">Informe Médico</option>
        <option value="mantenimiento">Mantenimiento</option>
      </select><br><br>

      <label for="archivo">Seleccionar Archivo:</label><br>
      <input type="file" id="archivo" name="archivo" required><br><br>

      <input type="submit" value="Guardar Documento">
    </form>
  </main>

  <footer>
    <p>&copy; 2026 MBM Médica - Todos los derechos reservados.</p>
  </footer>
</body>
</html>
