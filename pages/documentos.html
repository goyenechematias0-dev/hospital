<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.G.S.M. - Gestión Documental</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
        }
        .navbar {
            background-color: #1a365d;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
        }
        .navbar-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
            font-weight: normal;
        }
        .navbar-links a:hover {
            text-decoration: underline;
        }
        .container {
            max-width: 650px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #1a365d;
            margin-top: 0;
            font-size: 22px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #2d3748;
        }
        input, select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            font-size: 14px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
        }
        .btn-primary {
            background-color: #1a365d;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn-primary:hover {
            background-color: #2c5282;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <span>Gestión Documental</span>
        <div class="navbar-links">
            <a href="menu.html">Inicio</a> | 
            <a href="traslados.html">Traslados</a> | 
            <a href="documentos.html">Documentos</a> | 
            <a href="login.html">Cerrar Sesión</a>
        </div>
    </div>

    <div class="container">
        <h2>Subir Nuevo Documento Hospitalario</h2>
        <form>
            <div class="form-group">
                <label>Título del Documento:</label>
                <input type="text" placeholder="">
            </div>
            <div class="form-group">
                <label>Categoría:</label>
                <select>
                    <option value="historia">Historia Clínica</option>
                    <option value="informe">Informe de Traslado</option>
                </select>
            </div>
            <div class="form-group">
                <label>Seleccionar Archivo:</label>
                <input type="file" style="border: none; padding-left: 0;">
            </div>
            <button type="submit" class="btn-primary">Guardar Documento</button>
        </form>
    </div>

</body>
</html>
