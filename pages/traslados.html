<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.G.S.M. - Gestión de Traslados y Ambulancias</title>
    
    <!-- Leaflet CSS para el mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
        }
        .navbar {
            background-color: #1a365d;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
        }
        .navbar-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
            font-weight: normal;
        }
        .navbar-links a:hover {
            text-decoration: underline;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #1a365d;
            margin-top: 0;
            font-size: 22px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #2d3748;
        }
        input, select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            font-size: 14px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
        }
        .btn-primary {
            background-color: #1a365d;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-primary:hover {
            background-color: #2c5282;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .row-buttons {
            display: flex;
            gap: 10px;
        }
        #map {
            height: 400px;
            width: 100%;
            border-radius: 6px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Barra de navegación superior -->
    <div class="navbar">
        <span>Gestión de Traslados y Ambulancias</span>
        <div class="navbar-links">
            <a href="../index.html">Inicio</a> | 
            <a href="traslados.html">Traslados</a> | 
            <a href="documentos.html">Documentos</a> | 
            <a href="login.html">Cerrar Sesión</a>
        </div>
    </div>

    <div class="container">
        <!-- Formulario: Solicitar Nuevo Traslado -->
        <h2>Solicitar Nuevo Traslado</h2>
        <form action="../php/guardarTraslados.php" method="POST">
            <div class="form-group">
                <label for="origen">Origen:</label>
                <input type="text" id="origen" name="origen" required>
            </div>
            <div class="form-group">
                <label for="destino">Destino:</label>
                <input type="text" id="destino" name="destino" required>
            </div>
            <div class="form-group">
                <label for="acompanante">Acompañante:</label>
                <input type="text" id="acompanante" name="acompanante">
            </div>
            <div class="form-group">
                <label for="ambulancia">Asignar Ambulancia:</label>
                <select id="ambulancia" name="ambulancia" required>
                    <option value="">Seleccione una ambulancia...</option>
                    <option value="AMB-001">Ambulancia AMB-001</option>
                    <option value="AMB-002">Ambulancia AMB-002</option>
                </select>
            </div>
            <button type="submit" class="btn-primary">Registrar Traslado</button>
        </form>

        <!-- Formulario: Gestión de Flota de Ambulancias -->
        <h2 style="margin-top: 40px;">Gestión de Flota de Ambulancias</h2>
        <form action="../php/RegistroDeAmbulancia.php" method="POST">
            <div class="form-group">
                <label for="matricula">Matrícula:</label>
                <input type="text" id="matricula" name="matricula" placeholder="Ej: SAB-1234" required>
            </div>
            <button type="submit" class="btn-primary">Registrar Ambulancia</button>
        </form>

        <!-- Sección de Monitoreo con el Mapa Leaflet -->
        <h2 style="margin-top: 40px;">Monitoreo de Rutas y Unidades</h2>
        <div class="controls">
            <select id="departamento">
                <option value="Montevideo">Montevideo</option>
            </select>

            <label for="direccion" style="font-weight: bold; color: #2d3748;">Ingresar dirección de destino:</label>
            <input type="text" id="direccion" placeholder="Ej: Av. Italia 2870">

            <button type="button" id="generatePinBtn" class="btn-primary" style="background-color: #1d3557;">Generar Pin y Ruta</button>
            
            <div class="row-buttons">
                <button type="button" id="crearUnidadBtn" class="btn-primary" style="flex: 1;">+ Crear Unidad</button>
                <button type="button" id="eliminarUnidadBtn" class="btn-primary" style="flex: 1; background-color: #dc3545;">- Eliminar Unidad</button>
            </div>
        </div>

        <div id="pinStatus" style="font-size: 13px; color: #555; margin-top: 8px;"></div>

        <!-- Contenedor del Mapa -->
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Script JS para controlar el mapa -->
    <script src="../js/trasladosmap.js"></script>
</body>
</html>
