  <main>
    <h2>Solicitar Nuevo Traslado</h2>
    <form id="form-traslado">
      <label for="origen">Origen:</label><br>
      <input type="text" id="origen" name="origen" required><br><br>

      <input type="text" id="destino" name="destino" required><br><br>

      <label for="acompañante">Acompañante:</label><br>
      <input type="text" id="acompañante" name="acompañante"><br><br>

      <input type="submit" value="Registrar Traslado">
    </form>
