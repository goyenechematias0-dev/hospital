<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital de Clínicas - Registro de usuario</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <header class="login-header">
        <img src="../img/login.png" alt="Hospital de Clínicas">
        <span class="login-brand">Hospital de Clínicas</span>
    </header>

    <main class="container">
        <h2>Registro de usuario</h2>

        <div id="alert-registro" class="alert"></div>

        <form id="form-registro" autocomplete="on">
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre *</label>
                    <input class="form-control" type="text" id="nombre" name="nombre" placeholder="Juan" required>
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido *</label>
                    <input class="form-control" type="text" id="apellido" name="apellido" placeholder="Pérez" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="cedula">Cédula *</label>
                    <input class="form-control" type="text" id="cedula" name="cedula" placeholder="12345678" required>
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input class="form-control" type="tel" id="telefono" name="telefono" placeholder="099 123 456">
                </div>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico *</label>
                <input class="form-control" type="email" id="email" name="email" placeholder="usuario@hospital.com" required>
            </div>

            <div class="form-group">
                <label for="rol">Rol de usuario *</label>
                <select class="form-control" id="rol" name="rol" required>
                    <option value="">-- Seleccionar rol --</option>
                    <option value="administrador">Administrador</option>
                    <option value="medico">Médico</option>
                    <option value="chofer">Chofer</option>
                    <option value="copiloto">Copiloto</option>
                    <option value="paciente">Paciente</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password">Contraseña *</label>
                    <input class="form-control" type="password" id="password" name="password"
                           placeholder="Mínimo 6 caracteres" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="password2">Repetir contraseña *</label>
                    <input class="form-control" type="password" id="password2" name="password2"
                           placeholder="Repetí la contraseña" minlength="6" required>
                </div>
            </div>

            <button type="submit" class="btn btn-block">Registrar usuario</button>
        </form>

        <p class="auth-links">
            ¿Ya tenés cuenta? <a href="../index.html">Iniciar sesión</a>
        </p>
    </main>

    <footer>
        <p>&copy; 2026 MBM Médica - Todos los derechos reservados.</p>
    </footer>

    <script src="../js/registro.js"></script>
</body>
</html>
