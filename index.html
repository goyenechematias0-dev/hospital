<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital de Clínicas - Iniciar sesión</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="login-header">
        <img src="img/login.png" alt="Hospital de Clínicas">
        <span class="login-brand">Hospital de Clínicas</span>
    </header>

    <div class="login-container">
        <img src="img/login.png" alt="Hospital de Clínicas">
        <h1 id="titulo">Iniciar sesión</h1>
    </div>

    <div class="form-container">
        <div id="alert-login" class="alert"></div>

        <form id="form-login" autocomplete="on">
            <label for="identificador">Cédula o correo electrónico</label>
            <input type="text" id="identificador" name="identificador"
                   placeholder="Ingresá tu correo o cédula" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password"
                   placeholder="********" required>

            <button type="submit" class="btn btn-block">Iniciar sesión</button>
        </form>

        <a class="registro-link" href="pages/registroUsuario.html">Registrar funcionario</a>
    </div>

    <footer>
        <p>&copy; 2026 MBM Médica - Todos los derechos reservados.</p>
    </footer>

    <script src="js/login.js"></script>
</body>
</html>
